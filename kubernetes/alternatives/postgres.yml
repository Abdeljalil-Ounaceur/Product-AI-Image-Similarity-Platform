apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-vec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-vec
  template:
    metadata:
      labels:
        app: postgres-vec
    spec:
      containers:
      - name: postgres-vec
        image: docker.io/abdeljalil2003ounaceur/ai-image-similarity-postgres-oke:latest
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-vec
spec:
  type: ClusterIP
  selector:
    app: postgres-vec
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432