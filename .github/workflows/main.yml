name: Microservices Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: pip install requests python-dotenv
      
      - name: Build and start services
        run: docker compose -f docker-compose.ci.yml build && docker compose -f docker-compose.ci.yml up -d
      
      - name: Wait for Oracle DB to be ready
        run: |
          timeout 180 bash -c 'until docker compose -f docker-compose.ci.yml logs oracle-db | grep -q "DATABASE IS READY TO USE"; do sleep 5; done' || echo "Timed out waiting for Oracle, continuing anyway..."
      
      - name: Show all logs
        run: docker compose -f docker-compose.ci.yml logs
      
      - name: Populate database with products
        run: python ./database-setup/populate_products.py
        env:
          BASE_URL: http://localhost:8000
      
      - name: Check ML model logs
        run: docker compose -f docker-compose.ci.yml logs ml-model
      
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes
