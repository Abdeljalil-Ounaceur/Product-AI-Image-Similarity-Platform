name: Microservices Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build and start services
        run: docker-compose -f docker-compose.ci.yml build && docker-compose -f docker-compose.ci.yml up -d
      
      - name: Wait and capture logs
        run: |
          sleep 30
          docker-compose -f docker-compose.ci.yml logs ml-model
      
      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.ci.yml down --volumes