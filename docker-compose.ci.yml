version: '3.8'

services:
  backend:
    image: backend-fastapi
    build:
      context: ./backend-fastapi
    ports:
      - "8000:8000"
    environment:
      ML_SERVICE_URL: http://ml-model:3000
      MINIO_ENDPOINT_URL: http://ml-model:9000
      DB_HOST: oracle-db
      DB_USER: db_user
      DB_PASSWORD: password
      DB_PORT: 1521
      DB_SERVICE_NAME: freepdb1

  frontend:
    image: frontend-react
    build:
      context: ./frontend-react
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://backend:8000

  ml-model:
    image: bento-clip:latest
    build:
      context: ./ml-model-service
    ports:
      - "3000:3000"

